{% extends 'base.html' %}

{% block title %}Password changed — ShopSphere{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="row justify-content-center">
    <div class="col-md-9 col-lg-5 reveal">
      <div class="card-ss auth-card p-4 p-lg-5 text-center">
        <div class="auth-card__icon"><i class="bi bi-check-circle"></i></div>
        <h1 class="auth-card__title mt-3 mb-2">Your password has been changed</h1>
        <p class="text-muted">
          Your new password is active. You can now log in and pick up where
          you left off.
        </p>
        <a class="btn btn-ss-primary btn-lg" href="{% url 'login' %}">
          <i class="bi bi-box-arrow-in-right me-2"></i>Log in
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
